name: Check Swift Version Updates
on:
  schedule:
    - cron: '0 9 * * 1'   # every Monday
  workflow_dispatch:

jobs:
  check-swift-release:
    runs-on: ubuntu-latest
    # Repo-wide default workflow token permissions are read-only (confirmed via
    # `gh api repos/.../actions/permissions/workflow`), so `issues.create` below fails with
    # "Resource not accessible by integration" without this explicit grant. Scoped to just this
    # job rather than changing the repo-wide default, since no other workflow needs it.
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Get latest Swift release
        id: latest
        run: |
          # `apple/swift` was renamed to `swiftlang/swift` -- the old path 301-redirects, and
          # plain `curl -s` (no `-L`) doesn't follow redirects, so it silently returned the
          # redirect *notice* JSON (no `tag_name` field) instead of release data. `jq -r
          # '.tag_name'` on that yields the literal string "null", which then always compared
          # unequal to the known version and opened a bogus "New Swift release detected: null"
          # issue every run (see #20). Fixed URL, `-L` kept anyway as cheap insurance against a
          # future rename repeating this. `/releases/latest` itself excludes drafts/prereleases,
          # confirmed against the real endpoint to return a real, non-prerelease tag.
          RESPONSE=$(curl -sL https://api.github.com/repos/swiftlang/swift/releases/latest)
          TAG=$(echo "$RESPONSE" | jq -r '.tag_name // empty')
          if [ -z "$TAG" ]; then
            echo "::error::Could not read a tag_name from the GitHub API response: $RESPONSE"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Real tags look like `swift-6.3.3-RELEASE` -- extract just major.minor so a patch
          # release (6.3.1 -> 6.3.2 -> 6.3.3) doesn't trigger a review every few weeks; only a
          # genuinely new minor/major version (isolation semantics can change there) should.
          MAJOR_MINOR=$(echo "$TAG" | grep -oE '[0-9]+\.[0-9]+' | head -1)
          if [ -z "$MAJOR_MINOR" ]; then
            echo "::error::Could not parse a major.minor version out of tag '$TAG'"
            exit 1
          fi
          echo "version=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"
      - name: Compare with known versions
        id: compare
        run: |
          KNOWN=$(tail -1 SUPPORTED_SWIFT_VERSIONS.md)
          echo "known=$KNOWN" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.latest.outputs.version }}" != "$KNOWN" ]; then
            echo "new_version=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for existing open issue
        id: existing
        if: steps.compare.outputs.new_version == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'swift-version-watch'
            });
            return issues.data.length > 0;
          result-encoding: string
      - name: Open issue if new version found
        if: steps.compare.outputs.new_version == 'true' && steps.existing.outputs.result != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `New Swift release detected: ${{ steps.latest.outputs.tag }}`,
              body: `Latest release tag: \`${{ steps.latest.outputs.tag }}\` (${{ steps.latest.outputs.version }}). Last version reviewed: \`${{ steps.compare.outputs.known }}\`. Needs RuleSet review for isolation semantics changes.`,
              labels: ['swift-version-watch']
            });
