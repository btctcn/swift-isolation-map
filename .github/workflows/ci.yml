name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        # Release, not debug: once IndexStoreDB (Priority 2 Phase 3) is linked into the combined
        # test bundle, the debug-configuration build of swiftpm-testing-helper reproducibly
        # segfaults (signal 11, inside libswiftCore/the swift-testing runtime itself -- not in
        # this project's own code, and not related to which tests actually run). Release is
        # unaffected -- verified stable across repeated runs. See
        # docs/priority-2-phase-3-linking.md for the full investigation.
        #
        # --no-parallel: PR #12's first run (30257978327) hit a real `"Another instance of SwiftPM
        # is already running ... disk I/O error"` on the cross-file-witness fixture's shared `.build`
        # -- two concurrently-scheduled tests both drove real subprocesses against the same fixture
        # directory. Confirmed fixed by this flag (a rerun with it clean on that specific failure).
        # A second, separate failure (`CompiledDependencyCLITests.fullFixtureMatrix`) persisted even
        # serialized and is still under investigation -- see the DIAG dump step below.
        run: swift test -c release --no-parallel
      - name: Dump diagnostics
        if: always()
        run: cat /tmp/swift-isolation-map-diag.log 2>/dev/null || echo "(no diagnostics written)"
